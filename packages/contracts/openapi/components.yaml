              value:
                id: bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                bookingId: 88888888-8888-4888-8888-888888888888
                status: accepted
                statusUrl: /api/v1/booking-cancellations/bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                seatEffect: pending
                rightBindingEffect: pending
                failureReason: null
            inProgress:
              summary: Место снято, привязка права ещё не согласована
              value:
                id: bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                bookingId: 88888888-8888-4888-8888-888888888888
                status: in_progress
                statusUrl: /api/v1/booking-cancellations/bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                seatEffect: canceled
                rightBindingEffect: pending
                failureReason: null
            completed:
              summary: Место снято и привязка права снята
              value:
