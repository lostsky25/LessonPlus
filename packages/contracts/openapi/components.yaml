  responses:
    InvalidRequest:
      description: Тело, параметр или ключ идемпотентности не проходят проверку формы.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: urn:lessonplus:problem:invalid-request
            title: Некорректный запрос
            status: 400
            code: invalid_request
            detail: Поле studentId должно быть UUID.
            errors:
              - pointer: /studentId
                detail: Ожидается UUID.
    Unauthorized:
      description: Проектируется. В каркасе JWT нет, и этот ответ сейчас не возвращается.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: urn:lessonplus:problem:unauthorized
            title: Требуется аутентификация
            status: 401
            code: unauthorized
            detail: Запрос без учётных данных.
    Forbidden:
      description: Проектируется. Роль известна, но к операции не допущена. Сейчас проверка не выполняется.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: urn:lessonplus:problem:forbidden
            title: Недостаточно прав
            status: 403
            code: forbidden
            detail: Роли parent эта операция недоступна.
    NotFound:
      description: Объект владельца не найден. Это не отсутствие свободного места и не конфликт состояния.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: urn:lessonplus:problem:not-found
            title: Объект не найден
            status: 404
            code: not_found
            detail: Абонемент не найден.
    Conflict:
      description: >
        Конфликт состояния либо тот же Idempotency-Key с другим отпечатком.
        Повтор того же отпечатка конфликтом не является и возвращает сохранённый ответ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            state:
              summary: Состояние не допускает операцию
              value:
                type: urn:lessonplus:problem:state-conflict
                title: Конфликт состояния
                status: 409
                code: state_conflict
                reason: right_consumed
                detail: Использованное право не переносится.
            idempotency:
              summary: Тот же ключ, другой отпечаток тела
              value:
                type: urn:lessonplus:problem:idempotency-key-reused
                title: Ключ идемпотентности уже использован
                status: 409
                code: idempotency_key_reused
                detail: Ключ уже сохранён с другим отпечатком тела запроса.
            differentResource:
              summary: Тот же ключ и то же тело, другой идентификатор в пути
              value:
                type: urn:lessonplus:problem:idempotency-key-reused
                title: Ключ идемпотентности уже использован
                status: 409
                code: idempotency_key_reused
                detail: >
                  Ключ уже сохранён для PATCH /v1/lessons/{lessonId} с другим lessonId.
                  Тело совпало, фактический path-параметр — нет.
                instance: /api/v1/lessons/12121212-1212-4121-8121-121212121212
    DependencyUnavailable:
      description: >
        Недоступна собственная база сервиса или зависимость, без которой шаг нельзя принять.
        Ошибка доставки уведомления сюда не входит и бизнес-операцию не отменяет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: urn:lessonplus:problem:dependency-unavailable
            title: Зависимость недоступна
            status: 503
            code: dependency_unavailable
            detail: PostgreSQL сервиса недоступен.
    Subscription:
