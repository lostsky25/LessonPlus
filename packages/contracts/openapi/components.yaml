                bookingId: 88888888-8888-4888-8888-888888888888
                status: completed
                statusUrl: /api/v1/booking-cancellations/bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                seatEffect: canceled
                rightBindingEffect: released
                failureReason: null
            rejected:
              summary: Эта отмена окончательно отклонена
              value:
                id: bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                bookingId: 88888888-8888-4888-8888-888888888888
                status: rejected
                statusUrl: /api/v1/booking-cancellations/bcbcbcbc-bcbc-4bcb-8bcb-bcbcbcbcbcbc
                seatEffect: pending
                rightBindingEffect: pending
                failureReason: booking_not_cancelable
    AttendanceCorrectionAccepted:
      description: >
        Запрос исправления принят. Это ещё не новая окончательная отметка и не прежняя Attendance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttendanceCorrection'
          example:
            id: cececece-cece-4cec-8cec-cececececece
            attendanceId: 99999999-9999-4999-8999-999999999999
            requestedMark: absence
            status: accepted
            statusUrl: /api/v1/attendance-corrections/cececece-cece-4cec-8cec-cececececece
            markEffect: pending
            rightEffect: pending
            failureReason: null
    AttendanceCorrection:
      description: >
        Прогресс конкретного исправления. unspecified в завершённом примере не решает, списано ли
        право при отсутствии.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttendanceCorrection'
          examples:
            accepted:
              summary: Этот запрос исправления ещё не применён
              value:
                id: cececece-cece-4cec-8cec-cececececece
                attendanceId: 99999999-9999-4999-8999-999999999999
                requestedMark: absence
                status: accepted
                statusUrl: /api/v1/attendance-corrections/cececece-cece-4cec-8cec-cececececece
                markEffect: pending
                rightEffect: pending
                failureReason: null
            inProgress:
              summary: Отметка уже изменена, эффект для права ещё не окончателен
              value:
                id: cececece-cece-4cec-8cec-cececececece
                attendanceId: 99999999-9999-4999-8999-999999999999
                requestedMark: presence
                status: in_progress
                statusUrl: /api/v1/attendance-corrections/cececece-cece-4cec-8cec-cececececece
                markEffect: applied
                rightEffect: consume_pending
                failureReason: null
            completed:
              summary: Исправление на отсутствие завершено без решения о праве
              value:
                id: cececece-cece-4cec-8cec-cececececece
                attendanceId: 99999999-9999-4999-8999-999999999999
                requestedMark: absence
                status: completed
                statusUrl: /api/v1/attendance-corrections/cececece-cece-4cec-8cec-cececececece
                markEffect: applied
                rightEffect: unspecified
                failureReason: null
            rejected:
              summary: Это исправление окончательно отклонено
              value:
                id: cececece-cece-4cec-8cec-cececececece
                attendanceId: 99999999-9999-4999-8999-999999999999
                requestedMark: absence
                status: rejected
                statusUrl: /api/v1/attendance-corrections/cececece-cece-4cec-8cec-cececececece
                markEffect: pending
                rightEffect: pending
                failureReason: right_conflict
