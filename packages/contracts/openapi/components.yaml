    SchoolCancellationAccepted:
      description: >
        Запрос отмены школой принят. status accepted не завершает операцию: эффекты ещё pending.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchoolCancellation'
          example:
            id: cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
            lessonId: 77777777-7777-4777-8777-777777777777
            status: accepted
            statusUrl: /api/v1/school-cancellations/cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
            lessonEffect: pending
            rightEffect: pending
            transferLimitEffect: pending
            failureReason: null
    SchoolCancellation:
      description: >
        Прогресс конкретной отмены. completed есть только в примере, где занятие отменено,
        право сохранено и лимит переносов не израсходован.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchoolCancellation'
          examples:
            accepted:
              summary: Этот запрос ещё ждёт согласования эффектов
              value:
                id: cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonId: 77777777-7777-4777-8777-777777777777
                status: accepted
                statusUrl: /api/v1/school-cancellations/cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonEffect: pending
                rightEffect: pending
                transferLimitEffect: pending
                failureReason: null
            inProgress:
              summary: Занятие уже отменено, остальные эффекты ещё не согласованы
              value:
                id: cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonId: 77777777-7777-4777-8777-777777777777
                status: in_progress
                statusUrl: /api/v1/school-cancellations/cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonEffect: canceled
                rightEffect: pending
                transferLimitEffect: pending
                failureReason: null
            completed:
              summary: Все бизнес-эффекты отмены согласованы
              value:
                id: cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonId: 77777777-7777-4777-8777-777777777777
                status: completed
                statusUrl: /api/v1/school-cancellations/cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonEffect: canceled
                rightEffect: preserved
                transferLimitEffect: not_spent
                failureReason: null
            rejected:
              summary: Эта операция окончательно отклонена
              value:
                id: cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonId: 77777777-7777-4777-8777-777777777777
                status: rejected
                statusUrl: /api/v1/school-cancellations/cdcdcdcd-cdcd-4cdc-8cdc-cdcdcdcdcdcd
                lessonEffect: pending
                rightEffect: pending
                transferLimitEffect: pending
                failureReason: right_conflict
    BookingCancellationAccepted:
      description: Запрос обычной отмены записи принят. Место и привязка права ещё не сняты.
      content:
